<!DOCTYPE html>
<html>
<head>
    <title>Flask Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f0f0;
            text-align: center;
            padding-top: 80px;
        }

        .calculator {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            color: green;
            font-size: 20px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Python Calculator</h2>

        <form method="POST">

            <input
                type="number"
                step="any"
                name="num1"
                placeholder="First number"
                required
            >

            <select name="operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (*)</option>
                <option value="divide">Division (/)</option>
            </select>

            <input
                type="number"
                step="any"
                name="num2"
                placeholder="Second number"
                required
            >

            <button type="submit">Calculate</button>

        </form>

        {% if result is not none %}
            <h3 class="result">Result: {{ result }}</h3>
        {% endif %}

        {% if error %}
            <h3 class="error">{{ error }}</h3>
        {% endif %}

    </div>

</body>
</html>
